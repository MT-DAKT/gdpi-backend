services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSGRES_DB:-gdpi}
      POSTGRES_USER: ${POSTGRES_USER:-gdpi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gdpi}
    volumes:
      -postgres_data:/var/lib/postgresql/data
    ports:
      -"5432:5432"

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"

  api: 
    build: .
    restart: always
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      -"8000:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.dev
    env_file:
      - .env
    depends_on:
      - db
      - redis

volumes:
  postgres_data: